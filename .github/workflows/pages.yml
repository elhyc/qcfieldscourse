name: Deploy mdBook to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install mdBook
        run: cargo install mdbook --locked

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install notebook converter
        run: python -m pip install nbconvert

      - name: Convert notebooks to mdBook chapters
        run: |
          python -m jupyter nbconvert --to markdown qc1.ipynb --output part-1 --output-dir src
          python -m jupyter nbconvert --to markdown qc2.ipynb --output part-2 --output-dir src
          python -m jupyter nbconvert --to markdown qc3.ipynb --output part-3 --output-dir src
          python -m jupyter nbconvert --to markdown qc4.ipynb --output part-4 --output-dir src

      - name: Normalize notebook math for mdBook
        run: |
          python scripts/normalize_mdbook_math.py src/part-1.md
          python scripts/normalize_mdbook_math.py src/part-2.md
          python scripts/normalize_mdbook_math.py src/part-3.md
          python scripts/normalize_mdbook_math.py src/part-4.md

      - name: Copy notebook image assets
        run: |
          shopt -s nullglob
          files=( *.png *.jpg *.jpeg *.gif *.svg )
          if [ ${#files[@]} -gt 0 ]; then
            cp "${files[@]}" src/
          fi

      - name: Build book
        run: mdbook build

      - name: Preserve applet assets
        run: |
          mkdir -p book/applets
          cp -r src/applets/* book/applets/

      - name: Preserve existing HTML notes
        run: cp qc1.html book/qc1.html

      - name: Disable Jekyll
        run: touch book/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: book

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
